apiVersion: 1

groups:
  - orgId: 1
    name: pui-alert-rules
    folder: PUI Observability
    interval: 30s
    rules:
      - uid: pui-high-error-rate
        title: HighErrorRate
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              editorMode: code
              expr: sum(rate(http_server_request_duration_seconds_count{service_name=~"apiservice|puiproxy|webfrontend",http_response_status_code=~"5.."}[5m])) / sum(rate(http_server_request_duration_seconds_count{service_name=~"apiservice|puiproxy|webfrontend"}[5m]))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              expression: A
              type: threshold
              conditions:
                - evaluator:
                    params:
                      - 0.05
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    type: last
                  type: query
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 2m
        annotations:
          summary: Error rate is above 5%.
          description: Elevated 5xx failure ratio detected.
        labels:
          severity: critical
          source: grafana

      - uid: pui-slow-response
        title: SlowResponse
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              editorMode: code
              expr: histogram_quantile(0.95, sum(rate(http_server_request_duration_seconds_bucket{service_name=~"apiservice|puiproxy|webfrontend"}[5m])) by (le))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              expression: A
              type: threshold
              conditions:
                - evaluator:
                    params:
                      - 2
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    type: last
                  type: query
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: p95 latency above 2 seconds.
          description: API response time threshold exceeded.
        labels:
          severity: warning
          source: grafana

      - uid: pui-service-down
        title: ServiceDown
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 120
              to: 0
            model:
              editorMode: code
              expr: sum(up{job="prometheus"})
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              expression: A
              type: threshold
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    type: last
                  type: query
              refId: C
        noDataState: Alerting
        execErrState: Error
        for: 1m
        annotations:
          summary: Monitoring stack is not reachable.
          description: Prometheus target state indicates outage.
        labels:
          severity: critical
          source: grafana

      - uid: pui-exception-spike
        title: ExceptionSpike
        condition: C
        data:
          - refId: A
            datasourceUid: loki
            relativeTimeRange:
              from: 300
              to: 0
            model:
              editorMode: code
              expr: sum(count_over_time({service_name=~"apiservice|webfrontend|puiproxy"} |= "Exception" [5m]))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              queryType: instant
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              expression: A
              type: threshold
              conditions:
                - evaluator:
                    params:
                      - 10
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    type: last
                  type: query
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 1m
        annotations:
          summary: Exception spike detected in logs.
          description: More than 10 exceptions over 5 minutes.
        labels:
          severity: warning
          source: grafana

      - uid: pui-failed-requests-burst
        title: FailedRequestsBurst
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange:
              from: 300
              to: 0
            model:
              editorMode: code
              expr: increase(pui_requests_failed_total[5m])
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              expression: A
              type: threshold
              conditions:
                - evaluator:
                    params:
                      - 20
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    type: last
                  type: query
              refId: C
        noDataState: NoData
        execErrState: Error
        for: 1m
        annotations:
          summary: Unusual failed-request burst in PUI.
          description: More than 20 failed requests in 5 minutes.
        labels:
          severity: warning
          source: grafana
